<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title if title else "URL Registry" }}</title>
    <link rel="stylesheet" href="https://unpkg.com/missing.css@1.1.1/dist/missing.min.css" />
    <link rel="stylesheet" href="/static/site.css?v=2" />
  </head>
  <body>
    <header class="layout-row">
      <div class="layout-row align-center space-between">
        <h1 class="logo"><a href="/admin/">URL Registry</a></h1>
        {% if user %}
        <nav>
          <a href="/admin/">Dashboard</a>
          {% if user.is_admin %}<a href="/admin/fleet">Workers &amp; jobs</a>{% endif %}
          <a href="/admin/users">Users</a>
          <a href="/admin/logout">Logout</a>
        </nav>
        {% endif %}
      </div>
    </header>
    <main class="container">
      {% if message %}
      <div class="notice">{{ message }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
    <footer class="container">
      <small>Alpha Mailer URL registry prototype</small>
    </footer>
  </body>
</html>
