{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h2>Admin Login</h2>
  {% if error %}
  <p class="error">{{ error }}</p>
  {% endif %}
  <form method="post">
    <label>Email
      <input type="email" name="email" required />
    </label>
    <label>Password
      <input type="password" name="password" required />
    </label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
